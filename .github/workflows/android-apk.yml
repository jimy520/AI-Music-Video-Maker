name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI_Music_Video_Maker_Source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: |
          mkdir -p project
          unzip -q AI_Music_Video_Maker_Source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: gradle -p project :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Music-Video-Maker-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
