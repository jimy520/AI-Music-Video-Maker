
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q AI_Music_Video_Maker_Source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/java/com/beyond/musicmaker/MainActivity.kt

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Music-Video-Maker-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
